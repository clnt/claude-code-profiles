version: 2
builds:
  - main: .
    binary: ccp
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "ccp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: clnt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: production
    directory: Formula
    name: ccp
    homepage: https://github.com/clnt/claude-code-profiles
    description: Manage configuration profiles for Claude Code
    license: MIT
    install: |
      bin.install "ccp"

changelog:
  sort: asc
